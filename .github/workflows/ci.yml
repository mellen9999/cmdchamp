name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install bubblewrap (sandbox tests)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: shellcheck
        run: shellcheck cmdchamp

      - name: self-tests
        run: ./cmdchamp test

      - name: full suite
        run: ./test_cmdchamp.sh
