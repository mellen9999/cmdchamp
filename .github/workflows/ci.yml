name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install bubblewrap (sandbox tests)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: enable unprivileged user namespaces (so bwrap can sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: shellcheck
        run: shellcheck cmdchamp

      - name: self-tests
        run: ./cmdchamp test

      - name: full suite
        run: ./test_cmdchamp.sh

      - name: check() unit tests
        run: ./test_check.sh

      - name: audit (grading + wrong-answer rejection)
        run: ./audit.sh
